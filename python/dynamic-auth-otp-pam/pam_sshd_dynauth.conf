# /etc/pam.d/sshd  —— 动态密码双轨认证配置
#
# 规则说明：
#   动态密码用户 → pam_exec 调用 pam_dynauth.py 验证 OTP
#   普通用户     → pam_unix 验证系统密码（/etc/shadow）
#
# 认证流程（auth 栈）：
#   1. pam_exec 运行 pam_dynauth.py
#      - 若用户在动态列表中：OTP 正确返回 success，错误返回 auth_err
#      - 若用户不在动态列表：返回 ignore（PAM 继续执行下一行）
#   2. pam_unix 处理非动态用户的系统密码验证
#      - [success=done]：若 pam_exec 已 success，则跳过此行（done）
#      - 动态用户若 pam_exec 返回 auth_err，此行不会被执行（因为上一行是 requisite 语义）
#
# ─────────────────────────────────────────────────────────────────
# auth 栈
# ─────────────────────────────────────────────────────────────────

# 第一步：尝试动态密码认证
#   expose_authtok  — 将密码通过 stdin 传给脚本
#   [success=done ignore=ignore auth_err=die default=bad]
#     success   → 认证成功，跳过剩余 auth 模块，直接放行
#     ignore    → 该模块不处理（非动态用户），继续执行后续模块
#     auth_err  → 动态用户 OTP 错误，立即拒绝（die）
#     default   → 其他错误视为失败
auth  [success=done ignore=ignore auth_err=die default=bad]  pam_exec.so  expose_authtok  /usr/local/lib/dynauth/pam_dynauth.py

# 第二步：普通用户走系统密码
auth  required  pam_unix.so  nullok_secure

# ─────────────────────────────────────────────────────────────────
# account / password / session 栈（保持 Ubuntu 默认）
# ─────────────────────────────────────────────────────────────────
@include common-account
@include common-password
@include common-session
@include common-session-noninteractive